name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q app.py core.py inspector.py reporting.py i18n.py build.py tests

      - name: Check Python lint (undefined and unused names)
        run: |
          python -m pip install ruff
          ruff check --select F app.py core.py inspector.py reporting.py i18n.py paths.py build.py tests

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  native-build:
    name: Native package · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install runtime and packaging requirements
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt

      - name: Build native desktop package
        run: python build.py

      - name: Publish package as a CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: invent-ssh-${{ runner.os }}-${{ runner.arch }}-v0.4.0
          path: dist/
          if-no-files-found: error
          retention-days: 14
