name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q app.py core.py inspector.py reporting.py snapshots.py i18n.py paths.py build.py scripts tests

      - name: Check Python lint (undefined and unused names)
        run: |
          python -m pip install ruff
          ruff check --select F app.py core.py inspector.py reporting.py snapshots.py i18n.py paths.py build.py scripts tests

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  native-build:
    name: Native package · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Same rule as release.yml: the Intel macOS image may be retired at any time.
    continue-on-error: ${{ matrix.os == 'macos-15-intel' }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 as in release.yml: the oldest glibc the Linux package supports.
        os: [ubuntu-22.04, windows-latest, macos-latest, macos-15-intel]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install runtime and packaging requirements
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt

      - name: Install the Qt system libraries (Linux)
        if: runner.os == 'Linux'
        # PyInstaller copies the xcb libraries into the bundle, so X11 sessions work on machines
        # without them; libEGL/libGL stay with the system driver, as on any desktop.
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-randr0 libxcb-xkb1 libnss3 libegl1 libgl1 libopengl0 xvfb

      - name: Build native desktop package
        run: python build.py

      - name: Open the window and check the UI loads
        shell: bash
        run: |
          version=$(python -c "import build; print(build.read_app_version())")
          case "${{ runner.os }}" in
            Linux) xvfb-run -a python scripts/smoke_window.py "dist/invenux-v${version}/invenux-v${version}" ;;
            Windows) python scripts/smoke_window.py "dist/invenux-v${version}.exe" ;;
            macOS) python scripts/smoke_window.py "dist/invenux-v${version}.app/Contents/MacOS/invenux-v${version}" ;;
          esac

      - name: Show the app log and crash events
        if: failure()
        shell: bash
        run: |
          log="$(python -c 'import paths; print(paths.get_logs_dir())')/invenux.log"
          if [ -f "$log" ]; then cat "$log"; else echo "No log at $log"; fi
          if [ "$RUNNER_OS" = Windows ]; then
            powershell -Command "Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='.NET Runtime','Application Error'} -MaxEvents 4 | Format-List TimeCreated,Message"
          fi

      - name: Publish package as a CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: invenux-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  linux-on-newer-system:
    name: Linux package on ubuntu-24.04
    # A bundle built on 22.04 must still open where Mesa and GLib are newer.
    needs: native-build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libgl1

      - name: Download the Linux package
        uses: actions/download-artifact@v4
        with:
          name: invenux-Linux-X64
          path: dist

      - name: Open the window and check the UI loads
        run: |
          version=$(python -c "import build; print(build.read_app_version())")
          app="dist/invenux-v${version}/invenux-v${version}"
          # Artifacts drop the execute bit; the release .tar.xz keeps it.
          chmod +x "$app" "dist/invenux-v${version}/_internal/PySide6/Qt/libexec/QtWebEngineProcess"
          xvfb-run -a python scripts/smoke_window.py "$app"
